name: Release

# Cutting a release is a tag push. Everything is re-verified before the GitHub
# release is created.
#
# The tag is what Packagist publishes: once dominion-solutions/filament-seo is
# linked to a Packagist package, a new tag is picked up automatically and the
# version becomes installable with
#   composer require dominion-solutions/filament-seo:^X.Y
#
# To release:
#   1. Make sure main is green.
#   2. Update CHANGELOG.md with the new version and date, commit, push.
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Version numbers are not written into composer.json: Packagist reads the tag
# and VCS tags alone decide what versions exist.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, pdo, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Validate composer.json
        run: composer validate --strict

      - name: Tests
        run: vendor/bin/phpunit

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Pint
        run: vendor/bin/pint --test

      - name: Diagrams are up to date
        run: composer diagrams-check

      - name: Documentation links
        run: composer docs

  release:
    name: Create release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          # A tag like v1.2.0-rc.1 is a pre-release; v1.2.0 is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
