name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref, but never cancel main or a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, pdo, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Larastan (${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lowest set is the only place a call to an API that does not exist
        # at the declared floor can be caught, so it gets analysed too.
        dependencies: ['lowest', 'highest']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, pdo, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Analyse
        run: vendor/bin/phpstan analyse --memory-limit=1G

  code-style:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Check formatting
        run: vendor/bin/pint --test

  package:
    name: Packagist readiness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check the package description
        run: |
          test "$(composer config description)" != '' \
            || { echo '::error::composer.json has no description'; exit 1; }

      - name: Check that composer.lock is not committed
        run: |
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo '::error::composer.lock is committed; a library should not ship one'
            exit 1
          fi

  diagrams:
    name: Diagrams
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Check committed diagrams are up to date
        run: composer diagrams-check

  docs:
    name: Documentation links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check relative links in the docs resolve
        run: composer docs
